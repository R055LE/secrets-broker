name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        # No -tags=integration. Those tests need a deployed worker/runner
        # sudoers boundary and a live Bitwarden account.
        run: go test ./... -race -count=1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Build
        run: |
          go build -ldflags="-s -w" -o bin/secrets-broker ./cmd/secrets-broker
          go build -ldflags="-s -w" -o bin/secrets-broker-admin ./cmd/secrets-broker-admin
          go build -ldflags="-s -w" -o bin/secrets-broker-worker ./cmd/secrets-broker-worker
          go build -ldflags="-s -w" -o bin/secrets-broker-relay ./cmd/secrets-broker-relay

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secrets-broker-linux-amd64
          path: bin/

  installer-test:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Build release bundles
        env:
          VERSION: v0.0.0-ci
        run: |
          umask 0002
          scripts/package-release.sh "$VERSION"

      - name: Verify release bundle contents
        env:
          VERSION: v0.0.0-ci
        run: |
          (cd dist && sha256sum --check checksums.txt)
          for arch in amd64 arm64; do
            bundle="secrets-broker-$VERSION-linux-$arch"
            archive="dist/$bundle.tar.gz"
            root_mode="$(tar -tvzf "$archive" "$bundle/" | awk 'NR == 1 { print $1 }')"
            test "$root_mode" = "drwxr-xr-x"
            for path in \
              bin/secrets-broker \
              bin/secrets-broker-admin \
              bin/secrets-broker-worker \
              bin/secrets-broker-relay \
              deploy/install-worker.sh \
              deploy/install-relay.sh \
              deploy/upgrade-release.sh \
              deploy/secrets-broker.logrotate \
              deploy/secrets-broker.sudoers \
              deploy/secrets-broker-relay.service \
              deploy/secrets-broker-relay.env.example \
              policy.example.toml \
              README.md \
              LICENSE; do
              tar -tzf "$archive" "$bundle/$path" >/dev/null
            done
          done

      - name: Check installer syntax
        run: |
          bash -n \
            scripts/package-release.sh \
            scripts/testdata/fake-gh \
            deploy/install-worker.sh \
            deploy/install-relay.sh \
            deploy/upgrade-release.sh
          shellcheck \
            scripts/package-release.sh \
            scripts/testdata/fake-gh \
            deploy/install-worker.sh \
            deploy/install-relay.sh \
            deploy/upgrade-release.sh
          deploy/upgrade-release.sh --help >/dev/null
          if deploy/upgrade-release.sh worker latest; then
            echo 'upgrade helper accepted an implicit release' >&2
            exit 1
          fi

      - name: Install and check worker boundary
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          tar -xzf dist/secrets-broker-v0.0.0-ci-linux-amd64.tar.gz -C "$test_dir"
          release_root="$test_dir/secrets-broker-v0.0.0-ci-linux-amd64"

          # shellcheck disable=SC2016 # Positional parameters belong in the generated mock script.
          printf '%s\n' \
            '#!/bin/sh' \
            'test "$1" = --version && { echo "bws 0.0.0-ci"; exit 0; }' \
            'test "$#" = 7 || exit 2' \
            'test "$1" = project || exit 2' \
            'test "$2" = get || exit 2' \
            'test "$4" = --output || exit 2' \
            'test "$5" = none || exit 2' \
            'test "$6" = --color || exit 2' \
            'test "$7" = no || exit 2' \
            'case "$3" in' \
            '  00000000-0000-0000-0000-000000000000) exit 0 ;;' \
            '  11111111-1111-1111-1111-111111111111)' \
            '    echo "Received error message from server: [404 Not Found] sentinel-private-response" >&2' \
            '    exit 1' \
            '    ;;' \
            'esac' \
            'exit 1' > "$test_dir/bws"
          chmod 0755 "$test_dir/bws"
          sed \
            -e 's#http://PASTE-RELAY-TAILSCALE-IP-HERE:7620#http://100.100.100.100:7620#' \
            -e 's#command_path = ".*"#command_path = "/usr/bin:/bin"#' \
            -e 's#PASTE-YOUR-BWS-SECRETS-MANAGER-PROJECT-UUID-HERE#00000000-0000-0000-0000-000000000000#' \
            -e 's#/home/YOUR-USER/code/YOUR-PROJECT#/home/runner#' \
            policy.example.toml > "$test_dir/policy.toml"

          install_output="$(
            sudo "$release_root/deploy/install-worker.sh" install \
              --client-user runner \
              --bws "$test_dir/bws" \
              --policy "$test_dir/policy.toml"
          )"
          printf '%s\n' "$install_output"
          [[ "$install_output" != *"Next: edit /etc/secrets-broker/policy.toml as root."* ]]
          [[ "$install_output" == *"Next: provision /var/lib/secrets-broker/bws-access-token from a trusted terminal."* ]]
          [[ "$install_output" == *"Log out and back in before using the new secrets-broker-clients membership."* ]]
          sudo -u secrets-broker /bin/sh -c \
            'umask 077; printf %s ci-only-placeholder > /var/lib/secrets-broker/bws-access-token'
          sudo "$release_root/deploy/install-worker.sh" check --client-user runner
          sudo test ! -e /var/log/secrets-broker/audit.jsonl
          sudo test ! -e /var/log/secrets-broker-admin/audit.jsonl

          sudo /usr/local/sbin/secrets-broker-admin projects list | grep -Fq agent-project
          sudo test ! -e /var/log/secrets-broker-admin/audit.jsonl
          sudo /usr/local/sbin/secrets-broker-admin projects create ci-created \
            --bws-project-id 11111111-1111-1111-1111-111111111111 \
            --token-entry ci-created-token \
            --working-dir /home/runner \
            | grep -Fq 'created in confirm mode with an empty allowlist'
          sudo /usr/local/sbin/secrets-broker-admin projects list \
            | grep -Eq '^ci-created[[:space:]]+confirm[[:space:]]'
          test "$(sudo /usr/local/sbin/secrets-broker-admin projects allowlist list ci-created | wc -l)" = 1
          test "$(sudo grep -Fc 'approval = "allowlisted-prompt"' /etc/secrets-broker/policy.toml)" = 2
          test "$(sudo stat -c '%U:%G:%a' /etc/secrets-broker/policy.toml)" = "root:secrets-broker:640"
          if sudo /usr/local/sbin/secrets-broker-admin projects create ci-created \
            --bws-project-id 11111111-1111-1111-1111-111111111111 \
            --token-entry ci-created-token \
            --working-dir /home/runner; then
            echo 'duplicate project creation unexpectedly succeeded' >&2
            exit 1
          fi
          test "$(sudo grep -Fc '"operation":"create_project"' /var/log/secrets-broker-admin/audit.jsonl)" = 2
          sudo grep -Fq '"outcome":"failed"' /var/log/secrets-broker-admin/audit.jsonl

          if sudo -u runner sudo -n -u secrets-broker \
            /usr/local/libexec/secrets-broker-worker access-check; then
            echo 'client sudoers rule unexpectedly allowed a worker argument' >&2
            exit 1
          fi
          access_output="$test_dir/access-output"
          # The runner shell deliberately owns the captured administrator output.
          # shellcheck disable=SC2024
          if sudo /usr/local/sbin/secrets-broker-admin projects access check > "$access_output"; then
            echo 'mixed project access diagnostic unexpectedly succeeded' >&2
            exit 1
          fi
          awk 'NR == 1 && $1 == "ALIAS" && $2 == "BWS_PROJECT_ID" && $3 == "STATUS" && NF == 3 { found = 1 } END { exit !found }' \
            "$access_output"
          awk '$1 == "agent-project" && $2 == "00000000-0000-0000-0000-000000000000" && $3 == "accessible" && NF == 3 { found = 1 } END { exit !found }' \
            "$access_output"
          awk '$1 == "ci-created" && $2 == "11111111-1111-1111-1111-111111111111" && $3 == "inaccessible" && NF == 3 { found = 1 } END { exit !found }' \
            "$access_output"
          if grep -Eq 'sentinel|response|token|working_dir|allowlist|secret' "$access_output"; then
            echo 'access diagnostic exposed an unapproved field' >&2
            exit 1
          fi
          sudo /usr/local/sbin/secrets-broker-admin projects access check agent-project \
            | awk '$1 == "agent-project" && $2 == "00000000-0000-0000-0000-000000000000" && $3 == "accessible" && NF == 3 { found = 1 } END { exit !found }'
          test "$(sudo grep -Fc '"operation":"check_project_access"' /var/log/secrets-broker-admin/audit.jsonl)" = 2
          sudo grep -Fq '"outcome":"inaccessible"' /var/log/secrets-broker-admin/audit.jsonl
          sudo grep -Fq '"outcome":"all_accessible"' /var/log/secrets-broker-admin/audit.jsonl
          sudo test ! -e /var/log/secrets-broker/audit.jsonl

          policy_before_removal="$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          remove_output="$(
            sudo /usr/local/sbin/secrets-broker-admin projects remove ci-created \
              --confirm ci-created
          )"
          printf '%s\n' "$remove_output"
          recovery_id="${remove_output##*Recovery ID: }"
          recovery_id="${recovery_id%.}"
          [[ "$recovery_id" =~ ^[0-9a-f]{32}$ ]]
          recovery_artifact="/var/lib/secrets-broker-admin/recovery/$recovery_id"
          test "$(sudo stat -c '%U:%G:%a' /var/lib/secrets-broker-admin)" = "root:root:700"
          test "$(sudo stat -c '%U:%G:%a' /var/lib/secrets-broker-admin/recovery)" = "root:root:700"
          test "$(sudo stat -c '%U:%G:%a' "$recovery_artifact")" = "root:root:600"
          if sudo grep -Fq 'alias = "ci-created"' /etc/secrets-broker/policy.toml; then
            echo 'removed project remains in policy' >&2
            exit 1
          fi
          sudo /usr/local/sbin/secrets-broker-admin projects recovery list \
            | awk -v id="$recovery_id" '$1 == id && $2 == "ci-created" && NF == 3 { found = 1 } END { exit !found }'
          if sudo /usr/local/sbin/secrets-broker-admin projects recovery list \
            | grep -Eq '11111111-1111-1111-1111-111111111111|ci-created-token|working_dir|argv|sha256'; then
            echo 'recovery listing exposed protected artifact fields' >&2
            exit 1
          fi
          sudo -u runner test ! -r "$recovery_artifact"
          sudo -u secrets-broker test ! -r "$recovery_artifact"
          sudo -u secrets-broker-runner test ! -r "$recovery_artifact"
          policy_after_removal="$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          if sudo /usr/local/sbin/secrets-broker-admin projects recovery restore "$recovery_id" \
            --confirm agent-project; then
            echo 'recovery restore accepted the wrong alias confirmation' >&2
            exit 1
          fi
          test "$policy_after_removal" = "$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          sudo /usr/local/sbin/secrets-broker-admin projects recovery restore "$recovery_id" \
            --confirm ci-created \
            | grep -Fq 'Project "ci-created" restored'
          test "$policy_before_removal" = "$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          sudo test -f "$recovery_artifact"

          second_remove_output="$(
            sudo /usr/local/sbin/secrets-broker-admin projects remove ci-created \
              --confirm ci-created
          )"
          second_recovery_id="${second_remove_output##*Recovery ID: }"
          second_recovery_id="${second_recovery_id%.}"
          [[ "$second_recovery_id" =~ ^[0-9a-f]{32}$ ]]
          [[ "$second_recovery_id" != "$recovery_id" ]]
          artifact_count="$(sudo find /var/lib/secrets-broker-admin/recovery -mindepth 1 -maxdepth 1 -type f | wc -l)"
          if sudo /usr/local/sbin/secrets-broker-admin projects remove agent-project \
            --confirm agent-project; then
            echo 'removal of the final project unexpectedly succeeded' >&2
            exit 1
          fi
          test "$artifact_count" = \
            "$(sudo find /var/lib/secrets-broker-admin/recovery -mindepth 1 -maxdepth 1 -type f | wc -l)"
          sudo grep -Fq 'alias = "agent-project"' /etc/secrets-broker/policy.toml
          sudo grep -Fq '"operation":"remove_project"' /var/log/secrets-broker-admin/audit.jsonl
          sudo grep -Fq '"operation":"restore_project"' /var/log/secrets-broker-admin/audit.jsonl
          sudo /usr/local/sbin/secrets-broker-admin projects set-approval agent-project automatic
          sudo grep -Fq 'approval = "never"' /etc/secrets-broker/policy.toml
          test "$(sudo stat -c '%U:%G:%a' /var/log/secrets-broker-admin/audit.jsonl)" = "root:root:600"
          sudo grep -Fq '"operation":"set_approval"' /var/log/secrets-broker-admin/audit.jsonl
          sudo grep -Fq '"outcome":"changed"' /var/log/secrets-broker-admin/audit.jsonl
          if sudo grep -Eq '11111111-1111-1111-1111-111111111111|token|bws_project_id|working_dir|secret|before_sha256|after_sha256|/var/lib/secrets-broker-admin' \
            /var/log/secrets-broker-admin/audit.jsonl; then
            echo 'administrator audit contains a forbidden field or value' >&2
            exit 1
          fi
          test "$(sudo stat -c '%U:%G:%a' /etc/secrets-broker/policy.toml)" = "root:secrets-broker:640"
          sudo /usr/local/sbin/secrets-broker-admin projects set-approval agent-project confirm
          sudo grep -Fq 'approval = "allowlisted-prompt"' /etc/secrets-broker/policy.toml

          sudo /usr/local/sbin/secrets-broker-admin projects allowlist list agent-project \
            | grep -Fq '["/usr/bin/printenv","TEST_SECRET_NAME"]'
          sudo /usr/local/sbin/secrets-broker-admin projects allowlist add agent-project -- \
            /usr/bin/true --ci-allowlist-test
          test "$(sudo grep -Fc 'argv = ["/usr/bin/true","--ci-allowlist-test"]' /etc/secrets-broker/policy.toml)" = 1
          sudo /usr/local/sbin/secrets-broker-admin projects allowlist add agent-project -- \
            /usr/bin/true --ci-allowlist-test \
            | grep -Fq 'already allows'
          sudo grep -Fq '"outcome":"no_change"' /var/log/secrets-broker-admin/audit.jsonl
          test "$(sudo grep -Fc 'argv = ["/usr/bin/true","--ci-allowlist-test"]' /etc/secrets-broker/policy.toml)" = 1
          sudo /usr/local/sbin/secrets-broker-admin projects allowlist remove agent-project -- \
            /usr/bin/true --ci-allowlist-test
          test "$(sudo grep -Fc 'argv = ["/usr/bin/true","--ci-allowlist-test"]' /etc/secrets-broker/policy.toml)" = 0
          test "$(sudo stat -c '%U:%G:%a' /etc/secrets-broker/policy.toml)" = "root:secrets-broker:640"
          sudo "$release_root/deploy/install-worker.sh" check --client-user runner

          sudo /bin/sh -c 'printf "\n# preserved by installer test\n" >> /etc/secrets-broker/policy.toml'
          policy_before="$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          token_before="$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          upgrade_output="$(
            sudo "$release_root/deploy/install-worker.sh" install \
              --client-user runner \
              --policy "$test_dir/policy.toml"
          )"
          printf '%s\n' "$upgrade_output"
          [[ "$upgrade_output" == *"Preserved existing policy at /etc/secrets-broker/policy.toml."* ]]
          [[ "$upgrade_output" != *"Next: edit /etc/secrets-broker/policy.toml as root."* ]]
          [[ "$upgrade_output" != *"Next: provision /var/lib/secrets-broker/bws-access-token from a trusted terminal."* ]]
          [[ "$upgrade_output" != *"Log out and back in before using the new secrets-broker-clients membership."* ]]
          test "$policy_before" = "$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          test "$token_before" = "$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          sudo "$release_root/deploy/install-worker.sh" check --client-user runner
          sudo test ! -e /var/log/secrets-broker/audit.jsonl

          sudo -u secrets-broker /bin/sh -c \
            'umask 077; printf "%s\n" ci-audit-record > /var/log/secrets-broker/audit.jsonl'
          sudo logrotate --force --state "$test_dir/logrotate.status" /etc/logrotate.d/secrets-broker
          sudo test ! -s /var/log/secrets-broker/audit.jsonl
          sudo test ! -s /var/log/secrets-broker-admin/audit.jsonl
          test "$(sudo stat -c '%U:%G:%a' /var/log/secrets-broker/audit.jsonl)" = "secrets-broker:secrets-broker:600"
          test "$(sudo stat -c '%U:%G:%a' /var/log/secrets-broker/audit.jsonl.1)" = "secrets-broker:secrets-broker:600"
          test "$(sudo stat -c '%U:%G:%a' /var/log/secrets-broker-admin/audit.jsonl)" = "root:root:600"
          test "$(sudo stat -c '%U:%G:%a' /var/log/secrets-broker-admin/audit.jsonl.1)" = "root:root:600"
          sudo grep -Fxq ci-audit-record /var/log/secrets-broker/audit.jsonl.1
          sudo grep -Fq '"operation":"set_approval"' /var/log/secrets-broker-admin/audit.jsonl.1
          sudo -u runner test ! -r /var/log/secrets-broker/audit.jsonl.1
          sudo -u secrets-broker-runner test ! -r /var/log/secrets-broker/audit.jsonl.1
          sudo -u runner test ! -r /var/log/secrets-broker-admin/audit.jsonl.1
          sudo -u secrets-broker test ! -r /var/log/secrets-broker-admin/audit.jsonl.1
          sudo -u secrets-broker-runner test ! -r /var/log/secrets-broker-admin/audit.jsonl.1
          sudo -u runner test ! -r "$recovery_artifact"
          sudo -u secrets-broker test ! -r "$recovery_artifact"
          sudo -u secrets-broker-runner test ! -r "$recovery_artifact"

      - name: Install and check relay service
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          tar -xzf dist/secrets-broker-v0.0.0-ci-linux-amd64.tar.gz -C "$test_dir"
          release_root="$test_dir/secrets-broker-v0.0.0-ci-linux-amd64"
          printf '%s\n' \
            'CONTROL_ADDR=100.100.100.100:7620' \
            'DECISION_ADDR=100.100.100.100:7621' > "$test_dir/relay.env"
          sudo ip address add 100.100.100.100/32 dev lo

          if sudo "$release_root/deploy/install-relay.sh" install \
            --environment "$release_root/deploy/secrets-broker-relay.env.example"; then
            echo 'placeholder relay environment was accepted' >&2
            exit 1
          fi
          sudo "$release_root/deploy/install-relay.sh" install --environment "$test_dir/relay.env"
          sudo "$release_root/deploy/install-relay.sh" check

          sudo /bin/sh -c 'printf "\n# preserved by installer test\n" >> /etc/secrets-broker-relay/environment'
          environment_before="$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          sudo "$release_root/deploy/install-relay.sh" install --environment "$test_dir/relay.env"
          test "$environment_before" = "$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          sudo "$release_root/deploy/install-relay.sh" check

      - name: Exercise verified role upgrades
        env:
          VERSION: v0.0.0-ci
        run: |
          test ! -e /usr/local/sbin/gh
          test_dir="$(mktemp -d)"
          trap 'sudo rm -f /usr/local/sbin/gh; rm -rf "$test_dir"' EXIT
          tar -xzf "dist/secrets-broker-$VERSION-linux-amd64.tar.gz" -C "$test_dir"
          release_root="$test_dir/secrets-broker-$VERSION-linux-amd64"
          sudo install -o root -g root -m 0755 scripts/testdata/fake-gh /usr/local/sbin/gh

          if sudo "$release_root/deploy/upgrade-release.sh" worker "$VERSION"; then
            echo 'upgrade helper accepted root execution' >&2
            exit 1
          fi

          sudo /bin/sh -c 'printf "%s\n" "#!/bin/sh" "exit 99" > /usr/local/bin/secrets-broker'
          sudo chmod 0755 /usr/local/bin/secrets-broker
          failed_cli_before="$(sudo sha256sum /usr/local/bin/secrets-broker)"
          if FAKE_GH_RELEASE_DIR="$PWD/dist" \
            FAKE_GH_LOG="$test_dir/gh-failed.log" \
            FAKE_GH_VERSION="$VERSION" \
            FAKE_GH_FAIL_ATTESTATION=1 \
            "$release_root/deploy/upgrade-release.sh" worker "$VERSION"; then
            echo 'upgrade helper accepted failed provenance verification' >&2
            exit 1
          fi
          test "$failed_cli_before" = "$(sudo sha256sum /usr/local/bin/secrets-broker)"
          test "$(wc -l < "$test_dir/gh-failed.log")" = 2

          handoff_dir="$(mktemp -d /tmp/secrets-broker-upgrade.XXXXXX)"
          cp "dist/secrets-broker-$VERSION-linux-amd64.tar.gz" "$handoff_dir/"
          handoff_archive="$handoff_dir/secrets-broker-$VERSION-linux-amd64.tar.gz"
          handoff_digest="$(sha256sum "$handoff_archive" | awk '{print $1}')"
          printf x >> "$handoff_archive"
          if sudo /usr/local/bin/secrets-broker-upgrade __install-verified \
            worker \
            "$VERSION" \
            amd64 \
            "$handoff_archive" \
            "$handoff_digest" \
            runner \
            "$(id -u)"; then
            echo 'privileged handoff accepted a changed archive' >&2
            exit 1
          fi
          test "$failed_cli_before" = "$(sudo sha256sum /usr/local/bin/secrets-broker)"
          rm -rf "$handoff_dir"

          policy_before="$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          token_before="$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          FAKE_GH_RELEASE_DIR="$PWD/dist" \
            FAKE_GH_LOG="$test_dir/gh-worker.log" \
            FAKE_GH_VERSION="$VERSION" \
            /usr/local/bin/secrets-broker-upgrade worker "$VERSION"
          test "$policy_before" = "$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          test "$token_before" = "$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          test "$(wc -l < "$test_dir/gh-worker.log")" = 2
          cmp -s "$release_root/bin/secrets-broker" /usr/local/bin/secrets-broker
          cmp -s "$release_root/bin/secrets-broker-admin" /usr/local/sbin/secrets-broker-admin
          cmp -s "$release_root/bin/secrets-broker-worker" /usr/local/libexec/secrets-broker-worker
          cmp -s "$release_root/deploy/upgrade-release.sh" /usr/local/bin/secrets-broker-upgrade

          environment_before="$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          FAKE_GH_RELEASE_DIR="$PWD/dist" \
            FAKE_GH_LOG="$test_dir/gh-relay.log" \
            FAKE_GH_VERSION="$VERSION" \
            /usr/local/bin/secrets-broker-upgrade relay "$VERSION"
          test "$environment_before" = "$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          test "$(wc -l < "$test_dir/gh-relay.log")" = 2
          cmp -s "$release_root/bin/secrets-broker-relay" /usr/local/bin/secrets-broker-relay
          cmp -s "$release_root/deploy/upgrade-release.sh" /usr/local/bin/secrets-broker-upgrade

  release:
    needs: [build, installer-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Package release bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/package-release.sh "$VERSION"

      - name: Attest release bundles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
