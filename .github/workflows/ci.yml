name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Test
        # No -tags=integration. Those tests need a deployed worker/runner
        # sudoers boundary and a live Bitwarden account.
        run: go test ./... -race -count=1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'

      - name: Build
        run: |
          go build -ldflags="-s -w" -o bin/secrets-broker ./cmd/secrets-broker
          go build -ldflags="-s -w" -o bin/secrets-broker-worker ./cmd/secrets-broker-worker
          go build -ldflags="-s -w" -o bin/secrets-broker-relay ./cmd/secrets-broker-relay

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-broker-linux-amd64
          path: bin/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'

      - name: Cross-compile
        # linux/amd64 + linux/arm64 only. The worker boundary depends on Linux
        # users, sudoers, procfs ownership, and no-follow file opens.
        # VERSION comes from env, not interpolated into the script string,
        # so a tag name can't inject shell commands here.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -ldflags="-s -w -X github.com/R055LE/secrets-broker/internal/cli.Version=$VERSION" \
              -o dist/secrets-broker-linux-$arch ./cmd/secrets-broker
            GOOS=linux GOARCH=$arch go build -ldflags="-s -w" \
              -o dist/secrets-broker-worker-linux-$arch ./cmd/secrets-broker-worker
            GOOS=linux GOARCH=$arch go build -ldflags="-s -w" \
              -o dist/secrets-broker-relay-linux-$arch ./cmd/secrets-broker-relay
          done
          (cd dist && sha256sum secrets-broker-linux-* secrets-broker-worker-linux-* secrets-broker-relay-linux-* > checksums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
