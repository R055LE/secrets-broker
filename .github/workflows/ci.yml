name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

      - name: Test
        # No -tags=integration — the real KWallet/kdialog/bws-backed tests
        # are skipped here on purpose; they need a real KDE desktop session
        # and a live Bitwarden account, neither of which CI has. Run them
        # locally with `task test:integration`.
        run: go test ./... -race -count=1

  build:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Build
        run: |
          go build -ldflags="-s -w" -o bin/secrets-broker ./cmd/secrets-broker
          go build -ldflags="-s -w" -o bin/secrets-broker-relay ./cmd/secrets-broker-relay

      - uses: actions/upload-artifact@v4
        with:
          name: secrets-broker-linux-amd64
          path: bin/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Cross-compile
        # linux/amd64 + linux/arm64 only — KWallet and kdialog are Linux/KDE
        # binaries; there's no point shipping darwin/windows builds for
        # adapters that can't run there in v1 (see decisions/0003).
        # VERSION comes from env, not interpolated into the script string,
        # so a tag name can't inject shell commands here.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -ldflags="-s -w -X github.com/R055LE/secrets-broker/internal/cli.Version=$VERSION" \
              -o dist/secrets-broker-linux-$arch ./cmd/secrets-broker
            GOOS=linux GOARCH=$arch go build -ldflags="-s -w" \
              -o dist/secrets-broker-relay-linux-$arch ./cmd/secrets-broker-relay
          done
          (cd dist && sha256sum secrets-broker-linux-* secrets-broker-relay-linux-* > checksums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
