name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: Test
        # No -tags=integration. Those tests need a deployed worker/runner
        # sudoers boundary and a live Bitwarden account.
        run: go test ./... -race -count=1

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Build
        run: |
          go build -ldflags="-s -w" -o bin/secrets-broker ./cmd/secrets-broker
          go build -ldflags="-s -w" -o bin/secrets-broker-worker ./cmd/secrets-broker-worker
          go build -ldflags="-s -w" -o bin/secrets-broker-relay ./cmd/secrets-broker-relay

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secrets-broker-linux-amd64
          path: bin/

  installer-test:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Build release bundles
        env:
          VERSION: v0.0.0-ci
        run: scripts/package-release.sh "$VERSION"

      - name: Verify release bundle contents
        env:
          VERSION: v0.0.0-ci
        run: |
          (cd dist && sha256sum --check checksums.txt)
          for arch in amd64 arm64; do
            bundle="secrets-broker-$VERSION-linux-$arch"
            archive="dist/$bundle.tar.gz"
            for path in \
              bin/secrets-broker \
              bin/secrets-broker-worker \
              bin/secrets-broker-relay \
              deploy/install-worker.sh \
              deploy/install-relay.sh \
              deploy/secrets-broker.sudoers \
              deploy/secrets-broker-relay.service \
              deploy/secrets-broker-relay.env.example \
              policy.example.toml \
              README.md \
              LICENSE; do
              tar -tzf "$archive" "$bundle/$path" >/dev/null
            done
          done

      - name: Check installer syntax
        run: |
          bash -n scripts/package-release.sh deploy/install-worker.sh deploy/install-relay.sh
          shellcheck scripts/package-release.sh deploy/install-worker.sh deploy/install-relay.sh

      - name: Install and check worker boundary
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          tar -xzf dist/secrets-broker-v0.0.0-ci-linux-amd64.tar.gz -C "$test_dir"
          release_root="$test_dir/secrets-broker-v0.0.0-ci-linux-amd64"

          printf '%s\n' '#!/bin/sh' 'test "$1" = --version && { echo "bws 0.0.0-ci"; exit 0; }' 'exit 1' > "$test_dir/bws"
          chmod 0755 "$test_dir/bws"
          sed \
            -e 's#http://PASTE-RELAY-TAILSCALE-IP-HERE:7620#http://100.100.100.100:7620#' \
            -e 's#PASTE-YOUR-BWS-SECRETS-MANAGER-PROJECT-UUID-HERE#00000000-0000-0000-0000-000000000000#' \
            -e 's#/home/YOUR-USER/code/YOUR-PROJECT#/home/runner#' \
            policy.example.toml > "$test_dir/policy.toml"

          sudo "$release_root/deploy/install-worker.sh" install \
            --client-user runner \
            --bws "$test_dir/bws" \
            --policy "$test_dir/policy.toml"
          sudo -u secrets-broker /bin/sh -c \
            'umask 077; printf %s ci-only-placeholder > /var/lib/secrets-broker/bws-access-token'
          sudo "$release_root/deploy/install-worker.sh" check --client-user runner

          sudo /bin/sh -c 'printf "\n# preserved by installer test\n" >> /etc/secrets-broker/policy.toml'
          policy_before="$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          token_before="$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          sudo "$release_root/deploy/install-worker.sh" install \
            --client-user runner \
            --policy "$test_dir/policy.toml"
          test "$policy_before" = "$(sudo sha256sum /etc/secrets-broker/policy.toml)"
          test "$token_before" = "$(sudo sha256sum /var/lib/secrets-broker/bws-access-token)"
          sudo "$release_root/deploy/install-worker.sh" check --client-user runner

      - name: Install and check relay service
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          tar -xzf dist/secrets-broker-v0.0.0-ci-linux-amd64.tar.gz -C "$test_dir"
          release_root="$test_dir/secrets-broker-v0.0.0-ci-linux-amd64"
          printf '%s\n' \
            'CONTROL_ADDR=100.100.100.100:7620' \
            'DECISION_ADDR=100.100.100.100:7621' > "$test_dir/relay.env"
          sudo ip address add 100.100.100.100/32 dev lo

          if sudo "$release_root/deploy/install-relay.sh" install \
            --environment "$release_root/deploy/secrets-broker-relay.env.example"; then
            echo 'placeholder relay environment was accepted' >&2
            exit 1
          fi
          sudo "$release_root/deploy/install-relay.sh" install --environment "$test_dir/relay.env"
          sudo "$release_root/deploy/install-relay.sh" check

          sudo /bin/sh -c 'printf "\n# preserved by installer test\n" >> /etc/secrets-broker-relay/environment'
          environment_before="$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          sudo "$release_root/deploy/install-relay.sh" install --environment "$test_dir/relay.env"
          test "$environment_before" = "$(sudo sha256sum /etc/secrets-broker-relay/environment)"
          sudo "$release_root/deploy/install-relay.sh" check

  release:
    needs: [build, installer-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.6'

      - name: Package release bundles
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/package-release.sh "$VERSION"

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
