# Installed root-owned at /etc/secrets-broker/policy.toml.
# The worker rejects caller-selected paths and legacy desktop backends.

[runtime]
bws_binary = "/usr/local/bin/bws"
command_path = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
home = "/var/lib/secrets-broker"

[token_source]
backend = "file"

[token_source.file]
# Must be owned by the secrets-broker worker account and mode 0600 or tighter.
path = "/var/lib/secrets-broker/bws-access-token"

[approval_source]
backend = "tailscale-relay"

[approval_source.tailscale_relay]
# The relay must run on a separate device. Its Tailscale ACL must expose this
# control port only to the broker host. See decisions/0008 and 0009.
control_url = "http://PASTE-RELAY-TAILSCALE-IP-HERE:7620"
poll_interval_seconds = 2
timeout_seconds = 300

[[projects]]
alias = "agent-project"
bws_project_id = "PASTE-YOUR-BWS-SECRETS-MANAGER-PROJECT-UUID-HERE"
# Retained as the resolver interface's project-scoped lookup key. The isolated
# file backend uses one token file and does not inspect this value.
token_entry = "agent-project"
# Requests from any other resolved working directory are denied.
working_dir = "/home/YOUR-USER/code/YOUR-PROJECT"
approval = "never" # "always" | "prompt" | "never"

  [[projects.allow]]
  argv = ["/usr/bin/printenv", "TEST_SECRET_NAME"]

  # Only allowlist commands whose behavior is not extended by hooks, plugins,
  # config, or executable files from the agent-writable working tree. Put
  # sensitive workflows in a root-owned wrapper and allowlist its exact argv.
