# Copy to $XDG_CONFIG_HOME/secrets-broker/policy.toml (default
# ~/.config/secrets-broker/policy.toml) and fill in bws_project_id.

[token_source]
backend = "secret-service"   # "secret-service" | "env" | "file"

# Only needed when backend = "secret-service" (no config needed for "env" or "file").

# Uncomment for backend = "env" — a single env var, injected by whatever starts the
# process (systemd unit, container). Single-tenant: one broker process, one token.
# [token_source.env]
# var = "SECRETS_BROKER_BOOTSTRAP_TOKEN"

# Uncomment for backend = "file" — a single file path (Docker-secrets/Kubernetes-
# Secret-volume convention, usually tmpfs-backed). Must be mode 0600 or tighter —
# resolution is refused if the file is readable or writable by group or other.
# [token_source.file]
# path = "/run/secrets/bws-token"

# approval_source defaults to backend = "kdialog" (a live desktop session, kdialog --yesno)
# if this whole section is omitted. Uncomment for a headless deployment using
# secrets-broker-relay instead — see README's "Remote approval" section and
# decisions/0008 and decisions/0009 before using this; control_url MUST be the
# relay's tailscale IP, and the relay MUST run on a separate device from this broker.
# [approval_source]
# backend = "tailscale-relay"
#
# [approval_source.tailscale_relay]
# control_url = "http://PASTE-RELAY-TAILSCALE-IP-HERE:7620"
# poll_interval_seconds = 2    # omit for the default (2)
# timeout_seconds = 300        # omit for the default (300 = 5 minutes)

[[projects]]
alias          = "claude-code"
bws_project_id = "PASTE-YOUR-BWS-SECRETS-MANAGER-PROJECT-UUID-HERE"
# token_entry is looked up via `secret-tool lookup service secrets-broker entry <token_entry>`
token_entry    = "claude-code-agent"
approval       = "prompt"   # "always" | "prompt" | "never" — omit to default to "never"

  [[projects.allow]]
  argv = ["printenv", "TEST_SECRET_NAME"]

  # Add more allowlisted commands here, one [[projects.allow]] block per
  # command, e.g.:
  # [[projects.allow]]
  # argv = ["git", "push"]
