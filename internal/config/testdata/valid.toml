[token_source]
backend = "secret-service"

[[projects]]
alias          = "claude-code"
bws_project_id = "00000000-0000-0000-0000-000000000000"
token_entry    = "claude-code-agent"
approval       = "prompt"

  [[projects.allow]]
  argv = ["git", "push"]

  [[projects.allow]]
  argv = ["git", "pull"]
