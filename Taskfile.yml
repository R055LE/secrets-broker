version: '3'

vars:
  APP_NAME: secrets-broker
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: '0'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the secrets-broker binary
    cmds:
      - go build -ldflags="-s -w -X github.com/R055LE/secrets-broker/internal/cli.Version={{.VERSION}}" -o bin/secrets-broker ./cmd/secrets-broker

  build:relay:
    desc: Build the secrets-broker-relay binary (deploy this on a SEPARATE device — see decisions/0008)
    cmds:
      - go build -ldflags="-s -w" -o bin/secrets-broker-relay ./cmd/secrets-broker-relay

  build:worker:
    desc: Build the fixed-path worker installed root-owned under /usr/local/libexec
    cmds:
      - go build -ldflags="-s -w" -o bin/secrets-broker-worker ./cmd/secrets-broker-worker

  build:admin:
    desc: Build the root-only fixed-policy administrator CLI
    cmds:
      - go build -ldflags="-s -w" -o bin/secrets-broker-admin ./cmd/secrets-broker-admin

  test:
    desc: Run the hermetic unit test suite (no KWallet/kdialog/bws required)
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test ./... -race -count=1

  test:integration:
    desc: >
      Run integration tests against real bws and the deployed isolated runner hop. Run as the
      secrets-broker account. Requires SECRETS_BROKER_TEST_TOKEN_FILE,
      SECRETS_BROKER_TEST_PROJECT_ID, and SECRETS_BROKER_TEST_SECRET_NAME env vars
      (SECRETS_BROKER_TEST_SECRET_VALUE optional); tests skip cleanly if unset.
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -tags=integration ./... -race -count=1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:installers:
    desc: Check release and deployment script syntax
    cmds:
      - bash -n scripts/package-release.sh deploy/install-worker.sh deploy/install-relay.sh

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/
