version: '3'

vars:
  APP_NAME: secrets-broker
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: '0'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  build:
    desc: Build the secrets-broker binary
    cmds:
      - go build -ldflags="-s -w -X github.com/R055LE/secrets-broker/internal/cli.Version={{.VERSION}}" -o bin/secrets-broker ./cmd/secrets-broker

  test:
    desc: Run the hermetic unit test suite (no KWallet/kdialog/bws required)
    cmds:
      - go test ./... -race -count=1

  test:integration:
    desc: >
      Run integration tests against real Secret Service and bws — local-only. Requires
      SECRETS_BROKER_TEST_TOKEN_ENTRY, SECRETS_BROKER_TEST_PROJECT_ID, and
      SECRETS_BROKER_TEST_SECRET_NAME env vars (SECRETS_BROKER_TEST_SECRET_VALUE optional);
      tests skip cleanly if unset.
    cmds:
      - go test -tags=integration ./... -race -count=1

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ dist/
